<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Install &amp; share · UQNS</title>
  <meta name="description" content="Install UQNS as an Android app, or share it with family and friends by link, QR code or message.">
  <meta name="author" content="MJ Ahmad">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="https://mj-ahmad.github.io/install.html">

  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UQNS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('uqns.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/install.css">
</head>
<body class="ip-body" data-title-key="install.pageTitle" data-desc-key="install.pageDesc">

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="UQNS">
        <img src="assets/logo/logo-color.png" alt="UQNS logo" width="40" height="40">
        <span class="brand-name">UQNS</span>
      </a>
      <span class="ip-spacer"></span>
      <button type="button" class="theme-toggle" id="themeToggle" data-i18n-attr="aria-label:theme.label">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="lang-toggle" role="group" data-i18n-attr="aria-label:lang.label">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="bn">BN</button>
        <button type="button" data-lang="ar">AR</button>
      </div>
    </div>
  </header>

  <main class="ip">

    <!-- Install -->
    <section class="ip-hero" aria-labelledby="ipTitle">
      <div class="ip-icon"><img src="assets/icons/icon-192.png" alt="" width="108" height="108"></div>
      <h1 id="ipTitle" data-sh="install.title"></h1>
      <p class="ip-lead" data-sh="install.lead"></p>

      <div class="ip-cta" id="ipCta" hidden>
        <button type="button" class="btn btn-primary ip-install" id="installBtn" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
          <span data-sh="install.button"></span>
        </button>
        <p class="ip-done" id="installDone" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4.2 4.2L18.5 8"/></svg>
          <span data-sh="install.done"></span>
        </p>
      </div>

      <ul class="ip-perks">
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg><span data-sh="perk.full"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg><span data-sh="perk.home"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span data-sh="perk.offline"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-sh="perk.free"></span></li>
      </ul>
    </section>

    <!-- How to install by hand (hidden once the app is installed) -->
    <section class="ip-steps" id="installSteps" aria-labelledby="stepsTitle">
      <h2 id="stepsTitle" data-sh="steps.title"></h2>
      <div class="ip-seg" role="group" data-sh-attr="aria-label:steps.title">
        <button type="button" data-os="android" aria-pressed="true">Android</button>
        <button type="button" data-os="ios" aria-pressed="false">iPhone</button>
      </div>
      <ol class="ip-list" id="stepsAndroid">
        <li data-sh="steps.a1"></li>
        <li data-sh="steps.a2"></li>
        <li data-sh="steps.a3"></li>
        <li data-sh="steps.a4"></li>
      </ol>
      <ol class="ip-list" id="stepsIos" hidden>
        <li data-sh="steps.i1"></li>
        <li data-sh="steps.i2"></li>
        <li data-sh="steps.i3"></li>
        <li data-sh="steps.i4"></li>
      </ol>
    </section>

    <!-- Share -->
    <section class="ip-share" id="share" aria-labelledby="shareTitle">
      <h2 id="shareTitle" data-sh="share.title"></h2>
      <p class="ip-lead ip-lead-sm" data-sh="share.lead"></p>

      <div class="ip-panel">
        <div class="ip-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          <span class="ip-url" dir="ltr">mj-ahmad.github.io</span>
          <button type="button" class="ip-copy" id="shareCopy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.7a2.2 2.2 0 0 0-2.2-2.2H6.7a2.2 2.2 0 0 0-2.2 2.2v6.6a2.2 2.2 0 0 0 2.2 2.2h1.8"/></svg>
            <span data-sh="share.copy"></span>
          </button>
        </div>
        <p class="ip-status" id="shareStatus" role="status" aria-live="polite"></p>

        <button type="button" class="btn btn-primary ip-native" id="shareNative" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="m8 11 8-4M8 13l8 4"/></svg>
          <span data-sh="share.native"></span>
        </button>

        <div class="ip-apps" role="group" aria-label="UQNS">
          <a class="ip-app" data-share-link="whatsapp" target="_blank" rel="noopener">
            <span class="ip-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8L4 20z"/><path d="M9.2 8.8c.3 2.4 2.7 4.8 5.1 5.1l1.1-1.2-1.9-1-.8.7c-.9-.4-1.6-1.1-2-2l.7-.8-1-1.9-1.2 1.1z"/></svg></span>
            <span data-sh="share.whatsapp"></span>
          </a>
          <a class="ip-app" data-share-link="telegram" target="_blank" rel="noopener">
            <span class="ip-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3.5 10.8l5 1.9 1.9 5.8 2.7-3.3 4.4 3.3L21 4z"/><path d="m8.5 12.7 12.5-8.7"/></svg></span>
            <span data-sh="share.telegram"></span>
          </a>
          <a class="ip-app" data-share-link="facebook" target="_blank" rel="noopener">
            <span class="ip-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 21v-8h2.7l.5-3.2h-3.2V8c0-1 .4-1.7 1.8-1.7h1.5V3.4c-.7-.1-1.6-.2-2.5-.2-2.5 0-4.1 1.5-4.1 4.2v2.4H8.6V13h2.7v8z"/></svg></span>
            <span data-sh="share.facebook"></span>
          </a>
          <a class="ip-app" data-share-link="x" target="_blank" rel="noopener">
            <span class="ip-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l14 16M19 4 5 20"/></svg></span>
            <span data-sh="share.x"></span>
          </a>
          <a class="ip-app" data-share-link="email">
            <span class="ip-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg></span>
            <span data-sh="share.email"></span>
          </a>
        </div>

        <div class="ip-qr">
          <div class="ip-qr-tile"><img src="assets/share/qr.svg" width="132" height="132" alt="" id="qrImg"></div>
          <div class="ip-qr-text">
            <h3 data-sh="qr.title"></h3>
            <p data-sh="qr.text"></p>
          </div>
        </div>
      </div>
    </section>

    <div class="ip-back">
      <a class="btn" href="./" data-sh="back.home"></a>
    </div>

  </main>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/share-install.js"></script>
  <script src="assets/js/bottom-nav.js" defer></script>
</body>
</html>
